name: Update DAK rankings

on:
  schedule:
    # Saturday after the 19:00 Europe/Paris Aden siege window.
    - cron: "30 18 * * 6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch Vanilla Game sieges and rebuild rankings
        env:
          VANILLA_GAME_COOKIE: ${{ secrets.VANILLA_GAME_COOKIE }}
        run: python scripts/update_from_vanilla.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rankings.json reports
          if git diff --cached --quiet; then
            echo "No ranking changes"
          else
            git commit -m "Update siege rankings"
            git push
          fi
